<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pit Lane English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, warm coach for a 15-year-old racer; short Chinese lines, English content.
   IDEA: a towel on the beach between race weekends: sand, sea and a coral towel.
   PICTURE: flat top-down beach scene with a coral towel and a racing helmet.
   COLOUR and TYPE: sand ground, coral accent, teal sea; Nunito rounded + Noto Sans SC.
   LAYOUT: one phone column, max 560px, big tap targets, one task per screen. */
:root{color-scheme:light dark;
--bg:light-dark(#F2E6D5,#10282A);--card:light-dark(#FBF6EE,#1A3537);--card2:light-dark(#F6ECDF,#21403F);
--ink:light-dark(#2B2622,#F3E9DC);--mute:light-dark(#6B6158,#BFB3A6);--line:light-dark(#E4D5C2,#2E4D4E);
--coral:light-dark(#C24E2E,#EE8A68);--onc:light-dark(#FFFFFF,#1B100C);--coral-s:light-dark(#F8D9CC,#4A2C24);
--teal:light-dark(#22767A,#6CC3C3);--teal-s:light-dark(#D5ECEA,#1D4A4B);--sun:light-dark(#9A6A12,#F2C266);--sun-s:light-dark(#F7E7C2,#4A3C1E)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Nunito,"Noto Sans SC",system-ui,sans-serif;overflow-x:clip}
#app{max-width:560px;margin:0 auto;padding-bottom:40px}
.pad{padding:0 18px}
h1{font-size:32px;line-height:1.1;margin:0;font-weight:900;text-wrap:balance}
h2{font-size:22px;line-height:1.2;margin:0;font-weight:800}
p{margin:0}
.mute{color:var(--mute)}.sm{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.card{background:var(--card);border-radius:20px;padding:18px}
.hero{position:relative;height:200px;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.nav{position:absolute;left:0;right:0;top:14px;display:flex;gap:8px;padding:0 18px;flex-wrap:wrap}
.nav button{background:rgba(251,246,238,.9);border:0;color:#2B2622;font:900 14px Nunito,"Noto Sans SC",sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:6px 14px;min-height:40px;border-radius:999px;cursor:pointer}
.nav button.on{background:#C24E2E;color:#fff}
.top{display:flex;align-items:center;gap:12px;padding:18px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.btn{min-height:52px;border-radius:16px;border:0;font:800 16px Nunito,"Noto Sans SC",sans-serif;padding:0 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.pri{background:var(--coral);color:var(--onc)}
.sec{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.teal{background:var(--teal);color:var(--onc)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800;background:var(--card2)}
.chip.c{background:var(--coral-s);color:var(--coral)}.chip.t{background:var(--teal-s);color:var(--teal)}.chip.s{background:var(--sun-s);color:var(--sun)}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:0;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer;min-height:60px}
.step.now{outline:2px solid var(--coral)}
.dot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--card2);font-weight:900;font-size:14px}
.dot.ok{background:var(--teal);color:var(--onc)}.dot.now{background:var(--coral);color:var(--onc)}
.bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:5px;background:var(--teal)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 17px Nunito,"Noto Sans SC",sans-serif;text-align:left;cursor:pointer}
.opt .k{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--card2);font-weight:900;font-size:14px;flex:none}
.opt.sel{border-color:var(--coral);background:var(--coral-s)}.opt.sel .k{background:var(--coral);color:var(--onc)}
.opt.ok{border-color:var(--teal);background:var(--teal-s)}.opt.ok .k{background:var(--teal);color:var(--onc)}
.opt.bad{border-color:var(--coral);background:var(--coral-s)}.opt.bad .k{background:var(--coral);color:var(--onc)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{min-height:44px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 15px Nunito,sans-serif;cursor:pointer}
.seg button.on{border-color:var(--coral);background:var(--coral-s);color:var(--coral)}
.line{padding:8px 10px;border-radius:12px;transition:background .2s}
.line.cur{background:var(--sun-s)}
.who{font-weight:900}.who.rm{color:var(--coral)}.who.o{color:var(--teal)}
.blur .txt{filter:blur(6px);user-select:none}
.big{font-size:22px;line-height:1.5;font-weight:800}
.w-ok{color:var(--teal)}.w-bad{color:var(--coral);text-decoration:underline wavy;text-underline-offset:5px}
.tip{background:var(--sun-s);border-radius:14px;padding:10px 12px;font-size:15px}
.mic{width:88px;height:88px;border-radius:50%;border:0;background:var(--coral);color:var(--onc);display:grid;place-items:center;cursor:pointer;margin:0 auto}
.mic.on{background:var(--teal);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}.line{transition:none}}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.qdot{min-height:40px;border-radius:10px;border:0;background:var(--card);color:var(--ink);font:800 14px Nunito,sans-serif;cursor:pointer}
.qdot.a{background:var(--teal-s);color:var(--teal)}.qdot.cur{outline:2px solid var(--coral)}
textarea{width:100%;min-height:110px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:16px/1.5 Nunito,"Noto Sans SC",sans-serif;padding:12px}
table{border-collapse:collapse;width:100%}td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
.bubble{border-radius:18px;padding:12px 14px}
.ring{width:96px;height:96px;flex:none}
.lock{opacity:.55}
.note{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div id="app"></div>
<script>
{
/* ---------- CONTENT ---------- */
const DAYS = [
{ n:1, type:"Daily life", title:"Meet a new friend", other:"Leo",
  vocab:[
    {w:"paddock",z:"the area where teams keep their karts and tools",e:"Let's meet in the paddock after lunch."},
    {w:"qualifying",z:"the session that decides your starting position",e:"Qualifying is at 10 a.m."},
    {w:"mechanic",z:"a person who fixes and prepares your kart",e:"My mechanic checks my kart before every race."},
    {w:"nervous",z:"a little scared or worried",e:"I'm a little nervous today."},
    {w:"tight",z:"(a corner) very sharp, you must slow down a lot",e:"This corner is very tight."},
    {w:"friendly",z:"kind and nice to other people",e:"Everyone here is friendly."},
    {w:"relaxed",z:"calm, not worried",e:"I feel relaxed after a good lunch."},
    {w:"weekday",z:"Monday, Tuesday, Wednesday, Thursday or Friday",e:"My weekdays are very busy."}],
  listen:{lines:[
    ["Leo","Hi! Are you new here? I'm Leo."],
    ["RM","Hi Leo, I'm RM. I'm from Kuala Lumpur. This is my second race at this track."],
    ["Leo","Nice! Which kart is yours?"],
    ["RM","The blue one, number twenty-seven. My team is small, but they are really friendly."],
    ["Leo","Cool. Are you nervous about the race?"],
    ["RM","A little. The track is very fast, and the corners are tight. What about you?"],
    ["Leo","I'm OK. My brother is my mechanic, so I feel relaxed. Are you a student?"],
    ["RM","Yes, I am. I'm in high school. I'm in the school choir too, so my weekdays are very busy."],
    ["Leo","Wow, racing and singing! What is your favourite food after a race?"],
    ["RM","Nasi lemak, of course! What about you?"],
    ["Leo","Pizza. Hey, there is a café near the paddock. Are you free after qualifying?"],
    ["RM","Yes! Let's go together."]],
   qs:[
    {q:"Where is RM from?",o:["Kuala Lumpur","Penang","Singapore","Ipoh"],a:0},
    {q:"Who is Leo's mechanic?",o:["His father","His brother","His friend","His coach"],a:1},
    {q:"Why are RM's weekdays busy?",o:["She works at a café","She goes to school and sings in the choir","She trains at the gym every day","She fixes karts"],a:1}]},
  speak:{topic:"Introduce myself",parts:[
    ["RM","Hi, my name is RM. I am fifteen years old, and I am from Kuala Lumpur, Malaysia. I am a high school student, and I am also a kart driver."],
    ["RM","Racing is a big part of my life. On race weekends, I am at the track from early morning. My team is small, but everyone is friendly and hard-working. My mechanic is very important to me, because he prepares my kart before every session."],
    ["RM","When I am not racing, I sing in my school choir. Our choir is very good, and we sometimes join international competitions. Singing and racing are very different, but both of them need practice and focus."],
    ["RM","My weekdays are busy. I have classes in the day and homework at night. It is not easy, but I am happy because I love what I do."],
    ["RM","My favourite food is nasi lemak, and my favourite place to relax is the beach. My goal this year is to improve my English, so I can talk to drivers and reporters from other countries. Thank you for listening!"]]},
  grammar:{title:"am / is / are",
    intro:"In some languages, you can say \"The track very fast\" with no verb. In English, you always need am, is or are. Without it, the sentence is not complete.",
    rules:[["I","am","I am nervous. = I'm nervous."],["he / she / it\none person or one thing","is","My brother is my mechanic.\nThe track is fast."],["you / we / they\nmany people or many things","are","You are fast.\nThe corners are tight."]],
    traps:[["The track very fast.","The track is very fast.","Don't forget is."],["Leo and I am friends.","Leo and I are friends.","Leo and I = we, so use are."],["Everyone are friendly.","Everyone is friendly.","Everyone is singular, so use is."],["There is twenty karts.","There are twenty karts.","Many karts, so use there are."]],
    forms:"Questions: put am / is / are first → Are you free? Is she your friend?\nNegative: add not → I'm not / isn't / aren't",
    tip:"How to answer: first find the subject (who or what?), then choose am, is or are."},
  quiz:[
    {c:"Grammar",q:"I ___ nervous before every race.",o:["am","is","are","be"],a:0,y:"The subject is I, so we always use am (I'm)."},
    {c:"Grammar",q:"My brother ___ my mechanic.",o:["am","is","are","be"],a:1,y:"My brother is one person (he), so we use is."},
    {c:"Grammar",q:"The corners at this track ___ very tight.",o:["is","am","are","be"],a:2,y:"The subject is corners (many corners, with -s), not track. So we use are."},
    {c:"Grammar",q:"Leo and I ___ good friends now.",o:["am","is","are","be"],a:2,y:"Leo and I = two people = we, so we use are. Don't use am just because you see I."},
    {c:"Grammar",q:"___ you free after qualifying?",o:["Is","Am","Are","Be"],a:2,y:"You always goes with are. In a question, Are comes first."},
    {c:"Grammar",q:"There ___ a café near the paddock.",o:["is","are","am","be"],a:0,y:"A café is only one, so we say There is."},
    {c:"Grammar",q:"There ___ twenty karts in my race.",o:["is","are","am","be"],a:1,y:"Twenty karts are many, so we say There are."},
    {c:"Grammar",q:"Which sentence is correct?",o:["The track very fast.","The track is very fast.","The track are very fast.","The track am very fast."],a:1,y:"English always needs a be verb here. The track is one thing, so we use is."},
    {c:"Grammar",q:"My mum ___ not at the track today. She ___ at home.",o:["is / is","are / is","am / are","is / are"],a:0,y:"My mum = she, so both blanks use is."},
    {c:"Grammar",q:"Everyone in my team ___ friendly.",o:["are","is","am","be"],a:1,y:"Everyone means many people, but in English it is singular. So we use is. This is a common IELTS trap."},
    {c:"Vocabulary",q:"The area where teams keep their karts and tools is the ___.",o:["podium","paddock","grandstand","finish line"],a:1,y:"Paddock = where teams keep their karts and tools. The podium is for the top three. The grandstand is where fans sit."},
    {c:"Vocabulary",q:"The session that decides your starting position is ___.",o:["practice","qualifying","the final","warm-up"],a:1,y:"Qualifying decides where you start the race."},
    {c:"Vocabulary",q:"I feel ___ before the race. My hands are shaking.",o:["relaxed","nervous","bored","hungry"],a:1,y:"Shaking hands = nervous. Relaxed means the opposite."},
    {c:"Vocabulary",q:"A person who fixes and prepares your kart is a ___.",o:["marshal","mechanic","sponsor","driver"],a:1,y:"A mechanic fixes your kart. A marshal waves the flags. A sponsor gives money or support."},
    {c:"Vocabulary",q:"Monday to Friday are ___.",o:["weekends","weekdays","holidays","birthdays"],a:1,y:"Weekdays = Monday to Friday. The weekend = Saturday and Sunday."},
    {c:"Vocabulary",q:"Leo is very ___. He always smiles and helps new drivers.",o:["friendly","lazy","angry","quiet"],a:0,y:"He smiles and helps people, so he is friendly."},
    {c:"Spelling",q:"Choose the correct spelling: a person you like and spend time with.",o:["freind","friend","frend","friand"],a:1,y:"f-r-i-e-n-d: i comes before e. Tip: a friend is with you to the END (fri-END)."},
    {c:"Spelling",q:"Choose the correct spelling: the day after Tuesday.",o:["Wensday","Wednesday","Wednsday","Wedensday"],a:1,y:"Wed-nes-day. We don't say the first d, but we must write it."},
    {c:"Spelling",q:"Choose the correct spelling: a little scared or worried.",o:["nervus","nervous","nervouse","nerveous"],a:1,y:"nerv + ous. Same ending: famous, dangerous."},
    {c:"Spelling",q:"Choose the correct spelling: a person who fixes karts.",o:["mechanik","mekanic","mechanic","machanic"],a:2,y:"Here ch sounds like k: me-chan-ic."},
    {c:"Spelling",q:"Choose the correct spelling: \"I was late ___ of the traffic.\"",o:["becuase","because","becouse","bacause"],a:1,y:"be-cau-se. Tip: Big Elephants Can Always Understand Small Elephants."},
    {c:"Speaking",q:"New friend: \"Hi! I'm Leo. Are you new here?\" What is the best reply?",o:["Yes, I am. I'm RM. Nice to meet you!","Yes, I is new.","No, thank you.","I'm fine, and you?"],a:0,y:"Answer Are you...? with Yes, I am / No, I'm not. Then say your name."},
    {c:"Speaking",q:"Friend: \"What's your favourite food?\" What is the best reply?",o:["Yes, I do.","Nasi lemak! I love it.","I'm from KL.","It's at three o'clock."],a:1,y:"What asks for a thing, so say the name of the food."},
    {c:"Speaking",q:"Friend: \"Are you free after school today?\" You are busy. What is the best reply?",o:["Yes, I am busy.","Sorry, I'm busy. I have choir practice.","I'm 15.","It's very fast."],a:1,y:"Free = not busy. If you are busy, say Sorry, I'm busy + the reason. It is more polite."},
    {c:"Speaking",q:"Friend: \"How are you?\" What is the best reply?",o:["I'm 15 years old.","I'm good, thanks. How about you?","I'm from Malaysia.","Yes, I am."],a:1,y:"How are you? asks how you feel. Answer, then ask them back."}],
  talk:{role:"Leo (new friend)",qs:[
    {q:"Hi! I'm Leo. Where are you from?",m:"Hi Leo, I'm RM. I'm from Kuala Lumpur, Malaysia."},
    {q:"What do you do when you are not racing?",m:"I'm a high school student. I'm also in the school choir, so I sing a lot."},
    {q:"What is your favourite food?",m:"My favourite food is nasi lemak. It is spicy and really tasty!"}]}
},
{ n:2, type:"Racing", title:"Weekend chat and race interview", other:"Leo",
  vocab:[
    {w:"podium",z:"the place where the top three drivers stand after the race",e:"It was my first podium."},
    {w:"grip",z:"how well the tyres hold the track",e:"The grip was low in the rain."},
    {w:"overtake",z:"to pass the car or kart in front of you",e:"I overtook two drivers."},
    {w:"brake",z:"to slow down; also the pedal you press to slow down",e:"I braked late into Turn 1."},
    {w:"straight",z:"a long part of the track with no corners",e:"He was fast on the straight."},
    {w:"corner",z:"a place where the track turns",e:"Be careful in the corners."},
    {w:"improve",z:"to make something better",e:"I want to improve my starts."},
    {w:"supporter",z:"a person who helps you and cheers for you",e:"Thank you to all my supporters!"}],
  listen:{lines:[
    ["Leo","Hey RM! How was your weekend?"],
    ["RM","It was great, thanks! On Saturday, I was at the track for practice. On Sunday, my family and I were at the beach in Port Dickson."],
    ["Leo","Nice! Was the weather good?"],
    ["RM","Yes, it was sunny and hot. The water was really clear. What about you?"],
    ["Leo","My weekend was boring. I was at home, and my brother and I were sick."],
    ["RM","Oh no! Are you OK now?"],
    ["Leo","Yes, I'm better now, thanks. Were you tired after practice?"],
    ["RM","Very tired! The track was busy, and there were a lot of fast drivers. But my lap times were better than last week."],
    ["Leo","That's good news! The next race is in two weeks, right?"],
    ["RM","Yes. I am a little nervous, but I am also excited."]],
   qs:[
    {q:"Where was RM on Sunday?",o:["At the track","At the beach","At home","At school"],a:1},
    {q:"Why was Leo's weekend boring?",o:["He was at work","He and his brother were sick","The weather was bad","His kart was broken"],a:1},
    {q:"How were RM's lap times?",o:["Worse than last week","The same as last week","Better than last week","She did not drive"],a:2}]},
  speak:{topic:"Post-race interview",parts:[
    ["Reporter","How do you feel after today's race?"],
    ["RM","I feel very happy. I started from P6, and I finished in P3. It was my first podium this season, so it was a special day for me and my team."],
    ["Reporter","What was the most difficult part of the race?"],
    ["RM","The track was wet in the morning, so the grip was low. In the first two laps, I was very careful in the corners. After that, the track was drier, and I could push harder."],
    ["Reporter","How did you overtake the driver in front of you?"],
    ["RM","I was faster in the last corner, so I stayed close to him on the straight. Then I braked later than him into Turn 1 and took the position."],
    ["Reporter","What will you work on before the next race?"],
    ["RM","I want to improve my starts. I lost one position at the start today. I will practise with my team and look at my data."],
    ["Reporter","Any message for your supporters?"],
    ["RM","Thank you to my family, my team and my sponsors. I could not do this without you!"]]},
  grammar:{title:"was / were (the past of am / is / are)",
    intro:"After the race, yesterday, last week... When we talk about the past, am and is become was, and are becomes were. Reporters usually ask about a race that just finished, so you will use these a lot.",
    rules:[["I / he / she / it\none person or one thing","was","I was nervous.\nThe track was wet."],["you / we / they\nmany people or many things","were","You were fast.\nThe tyres were cold."]],
    traps:[["Yesterday I am tired.","Yesterday I was tired.","Yesterday is the past, so use was."],["The tyres was cold.","The tyres were cold.","Tyres are many, so use were."],["You was fast!","You were fast!","You always uses were."],["Was you ready?","Were you ready?","Questions too: Were you...?"]],
    forms:"Questions: Was it hard? Were you nervous?\nNegative: wasn't / weren't\nPast time words: yesterday, last week, this morning, after the race, two days ago",
    tip:"How to answer: first ask \"Is it in the past?\", then ask \"Is the subject one or many?\""},
  quiz:[
    {c:"Grammar",q:"The track ___ wet this morning.",o:["was","were","is","be"],a:0,y:"This morning is finished (past). The track is one thing, so we use was."},
    {c:"Grammar",q:"The tyres ___ cold in the first lap.",o:["was","were","is","be"],a:1,y:"Tyres are many, and it is in the past, so we use were."},
    {c:"Grammar",q:"I ___ very happy after the race yesterday.",o:["am","was","were","is"],a:1,y:"Yesterday = past. The subject is I, so we use was."},
    {c:"Grammar",q:"My mum and dad ___ at the track last Sunday.",o:["was","were","are","is"],a:1,y:"Two people + last Sunday (past), so we use were."},
    {c:"Grammar",q:"___ you nervous before the final yesterday?",o:["Was","Were","Are","Is"],a:1,y:"In the past, you always uses were, even for one person."},
    {c:"Grammar",q:"It ___ my first podium this season.",o:["was","were","are","am"],a:0,y:"The race is finished. It is one thing, so we use was."},
    {c:"Grammar",q:"We ___ not fast in the rain last week.",o:["was","were","is","are"],a:1,y:"We + last week, so we use were."},
    {c:"Grammar",q:"Which sentence is correct?",o:["Yesterday I am very tired.","Yesterday I was very tired.","Yesterday I were very tired.","Yesterday I be very tired."],a:1,y:"Yesterday means the past. With I, we use was."},
    {c:"Grammar",q:"Two drivers ___ in front of me after the start.",o:["was","were","is","am"],a:1,y:"Two drivers are many, so we use were."},
    {c:"Grammar",q:"\"Was the race difficult?\" \"Yes, it ___.\"",o:["was","were","is","did"],a:0,y:"If the question uses Was, the answer uses was: Yes, it was. / No, it wasn't."},
    {c:"Vocabulary",q:"The top three drivers stand on the ___.",o:["paddock","podium","pit lane","grid"],a:1,y:"The podium is for the top three. The paddock is where teams work."},
    {c:"Vocabulary",q:"When you pass the kart in front of you, you ___ it.",o:["overtake","brake","follow","crash"],a:0,y:"Overtake = pass the kart in front of you."},
    {c:"Vocabulary",q:"On a wet track, the tyres have less ___.",o:["grip","fuel","noise","colour"],a:0,y:"Grip = how well the tyres hold the track. On a wet track, grip is low."},
    {c:"Vocabulary",q:"You press the ___ to slow down.",o:["brake","break","gas pedal","horn"],a:0,y:"Brake = slow down. Break means to damage something or to rest. They sound the same but mean different things!"},
    {c:"Vocabulary",q:"A long part of the track with no corners is a ___.",o:["straight","corner","hairpin","kerb"],a:0,y:"A straight has no corners. A hairpin is a very tight U-shaped corner."},
    {c:"Vocabulary",q:"\"I want to ___ my starts.\" (make them better)",o:["improve","remove","prove","move"],a:0,y:"Improve = make something better."},

const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"],TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
const numW=n=>n<20?ONES[n]:n<100?TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:""):String(n);
const CON={"i'm":"i am","it's":"it is","let's":"let us","can't":"can not","cannot":"can not","don't":"do not","isn't":"is not","i'll":"i will","you're":"you are","what's":"what is","wasn't":"was not","weren't":"were not","couldn't":"could not"};
const EQ={practise:"practice",favourite:"favorite",colour:"color",tyres:"tires",tyre:"tire"};
function norm(s){s=s.toLowerCase().replace(/[’‘]/g,"'").replace(/-/g," ");s=s.split(/\s+/).map(w=>{const c=w.replace(/[^a-z0-9']/g,"");return CON[c]||w}).join(" ");s=s.replace(/([a-z])(\d)/g,"$1 $2").replace(/\d+/g,m=>" "+numW(+m)+" ");return s.replace(/[^a-z' ]/g," ").split(/\s+/).filter(Boolean).map(w=>EQ[w.replace(/'/g,"")]||w.replace(/'/g,""))}
function compare(target,heard){
  const disp=target.split(/\s+/);const flat=[];disp.forEach((w,i)=>norm(w).forEach(t=>flat.push([t,i])));
  const h=norm(heard);const n=flat.length,m=h.length;const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=flat[i][0]===h[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(flat[i][0]===h[j]){hit[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  const ok=disp.map(()=>true);flat.forEach((f,k)=>{if(!hit[k])ok[f[1]]=false});
  return disp.map((w,k)=>({w,ok:ok[k]}));
}
const TIP={choir:"Say /kwaɪə/, like \"kwire\" (it rhymes with fire). The ch sounds like k.",podium:"Say PO-di-um. Make PO strong.",qualifying:"Say KWOL-i-fy-ing. qu sounds like kw.",friendly:"Say fr together, and say the -ly at the end.",improve:"Say im-PROVE. Make PROVE strong. For v, touch your bottom lip with your top teeth.",supporters:"Say sup-POR-ters. Make POR strong, and say the s at the end.",kuala:"Say KWAH-la.",lumpur:"Say LOOM-poor.",braked:"brake + t: say \"braykt\". Say the t softly at the end.",started:"start + id: say STAR-tid.",finished:"finish + t: say FIN-isht.",could:"Don't say the l: say \"kud\".",without:"Say with-OUT. For th, put your tongue between your teeth.",season:"Say SEE-zn. The s sounds like z.",second:"Say SEC-ond. Don't drop the d at the end.",track:"Say tr together. Say the k sound at the end.",lap:"Say the p softly at the end.",grip:"Say gr together. Say the p at the end."};
function tipFor(w){w=w.toLowerCase().replace(/[^a-z']/g,"");
  if(TIP[w])return TIP[w];
  if(["the","this","that","then","than","there","they","with","their","them","other","brother","mother","father"].includes(w))return "th: put the tip of your tongue between your teeth and push air out (/ð/). Don't say d or z.";
  if(["three","think","thank","thanks","month","birthday"].includes(w))return "th: put your tongue between your teeth and blow air (/θ/). Don't say t or s.";
  if(/ed$/.test(w))return "Say the -ed ending: after p / k / s / sh / ch it sounds like /t/; after t / d it sounds like /ɪd/; after other sounds it is /d/.";
  if(/[td]$/.test(w))return "Say the "+w.slice(-1)+" at the end softly. Don't drop it.";
  if(/s$/.test(w)&&w.length>3)return "Say the s at the end (for many things, or for he / she).";
  return "This word was not clear. Listen once at slow speed, notice which part is strong, then say it again.";}

function speakAnalyse(heard){
  const K=DAYS[S.day-1].speak;const words=[];K.parts.forEach(p=>{if(p[0]==="RM")words.push(...p[1].split(/\s+/))});
  const res=compare(words.join(" "),heard);const ok=res.filter(x=>x.ok).length;
  const sents=[];let cur={w:[],ok:0};res.forEach(x=>{cur.w.push(x.w);if(x.ok)cur.ok++;if(/[.!?]$/.test(x.w)){sents.push(cur);cur={w:[],ok:0}}});if(cur.w.length)sents.push(cur);
  const weak=sents.map(x=>({text:x.w.join(" "),r:x.ok/x.w.length})).filter(x=>x.r<.8);
  const bad=[];res.forEach(x=>{const k=x.w.toLowerCase().replace(/[^a-z']/g,"");if(!x.ok&&k&&!bad.includes(k))bad.push(k)});
  return {words:res,score:Math.round(ok/res.length*100),weak,bad,heard};
}

function stats(){
  const qd=[];let qa=0,qc=0;const cat={};CATS.forEach(c=>cat[c]=[0,0]);
  for(let n=1;n<=AVAIL;n++){const q=P.days[n]&&P.days[n].quiz;if(q){qd.push([n,q.score,q.total||25]);qa+=q.total||25;qc+=q.score;CATS.forEach(c=>{if(q.byCat&&q.byCat[c]){cat[c][0]+=q.byCat[c][0];cat[c][1]+=q.byCat[c][1]}})}}
  const daysDone=ROAD.filter(r=>r[0]<=AVAIL&&dayDone(r[0])).length;
  const words=DAYS.reduce((a,d)=>a+(P.days[d.n]&&P.days[d.n].vocab?d.vocab.length:0),0);
  const sp=DAYS.map(d=>[d.n,P.days[d.n]&&P.days[d.n].speak]).filter(x=>x[1]&&x[1].best!=null);
  const talks=DAYS.reduce((a,d)=>a+((P.days[d.n]&&P.days[d.n].talk)||0),0);
  const lis=DAYS.map(d=>[d.n,P.days[d.n]&&P.days[d.n].listen]).filter(x=>x[1]!=null);
  const pron=[];DAYS.forEach(d=>{const p=P.days[d.n]&&P.days[d.n].pron;if(p)pron.push(...p)});
  const weak=CATS.filter(c=>cat[c][1]).sort((a,b)=>cat[a][0]/cat[a][1]-cat[b][0]/cat[b][1])[0];
  const pronWords={};pron.forEach(w=>pronWords[w]=(pronWords[w]||0)+1);
  const topPron=Object.entries(pronWords).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  return {qd,qa,qc,cat,daysDone,words,sp,talks,lis,weak,topPron};
}

function reportText(){const st=stats();const lv=level(st);
  return ["[Pit Lane English progress report] "+today(),"Level: "+lv[0],"Days done: "+st.daysDone+"/10 · Streak: "+(P.streak.n||0)+" days",
  "Daily scores: "+(st.qd.map(x=>"Day "+x[0]+" "+x[1]+"/"+x[2]).join(", ")||"none"),
  "By type: "+CATS.map(c=>c+" "+(st.cat[c][1]?Math.round(st.cat[c][0]/st.cat[c][1]*100)+"%":"—")).join(", "),
  "Listening: "+(st.lis.map(x=>"Day "+x[0]+" "+x[1]+"/3").join(", ")||"none"),
  "Words: "+st.words+" · Read aloud: "+(st.sp.map(x=>"Day "+x[0]+" best "+x[1].best+"%").join(", ")||"none")+" · Spoken answers: "+st.talks,
  "Often unclear words: "+(st.topPron.join(", ")||"none"),"Mistakes: "+P.mistakes.length,"Next: "+nextTip(st)].join("\n")}

/* ---------- RENDER + ACTIONS ---------- */
const app=document.getElementById("app");
function render(){app.innerHTML=(V[S.view]||V.home)();updMic()}
function openDay(n){S.day=n}
const A={
  nav:a=>{S.copied="";go(a)},
  go:a=>{if(a==="day")a="home";if(a==="speak"){S.sres=null}if(a==="talk"){S.ti=0;S.fb=null;S.talkText="";S.showModel=false}go(a)},
  noop:()=>{},
  openDay:a=>{S.day=+a;S.lr={};S.lChecked=false;S.showTxt=false;go("vocab")},
  step:a=>{S.day=curDay();if(a==="listen"){S.lr={};S.lChecked=false;S.showTxt=false}A.go(a==="quiz"?"lesson":a)},
  say:a=>{const v=DAYS[S.day-1].vocab[+a.slice(1)];speak([{text:v.w},{text:v.e}],.9)},
  vocabDone:()=>{D(S.day).vocab=true;touch("vocab");S.lr={};S.lChecked=false;S.showTxt=false;go("listen")},
  playDialog:()=>{if(S.playing){stopAudio();updPlay();hl(-1);return}const L=DAYS[S.day-1].listen.lines;speak(L.map(l=>({text:l[1],voice:l[0]==="RM"?"rounded":"airy"})),S.rate||.9)},
  rate:a=>{S.rate=+a;stopAudio();render()},
  toggleTxt:()=>{S.showTxt=!S.showTxt;render()},
  lpick:a=>{const [q,o]=a.split("-").map(Number);S.lr=S.lr||{};S.lr[q]=o;render()},
  lcheck:()=>{S.lChecked=true;const L=DAYS[S.day-1].listen;D(S.day).listen=L.qs.filter((q,i)=>S.lr[i]===q.a).length;touch("listen");render()},
  playSpeak:()=>{if(S.playing){stopAudio();updPlay();hl(-1);return}const K=DAYS[S.day-1].speak;speak(K.parts.map(p=>({text:p[1],voice:p[0]==="RM"?"rounded":"airy"})),S.rate||.9)},
  saySent:a=>{const x=S.sres&&S.sres.weak[+a];if(x)speak(x.text,.85)},
  micSpeak:()=>{stopAudio();micToggle(t=>{S.sres=speakAnalyse(t);const d=D(S.day);d.speak={best:Math.max((d.speak&&d.speak.best)||0,S.sres.score),last:S.sres.score,tries:((d.speak&&d.speak.tries)||0)+1};d.pron=(d.pron||[]).concat(S.sres.bad).slice(-80);touch("speak");render()})},
  speakDone:()=>{go("lesson")},
  speakSkip:()=>{D(S.day).speakSkip=true;touch();go("lesson")},
  startQuiz:()=>{D(S.day).grammar=true;S.retry=false;S.qset=DAYS[S.day-1].quiz.map((q,i)=>({d:S.day,i}));S.qi=0;S.ans={};S.qWarn=false;go("quiz")},
  qpick:a=>{const it=S.qset[S.qi];S.ans[it.d+"-"+it.i]=+a;S.qWarn=false;render()},
  qprev:()=>{S.qi=Math.max(0,S.qi-1);render()},qnext:()=>{S.qi=Math.min(S.qset.length-1,S.qi+1);render();window.scrollTo(0,0)},
  qjump:a=>{S.qi=+a;render();window.scrollTo(0,0)},
  qsubmit:()=>{const un=S.qset.filter(x=>S.ans[x.d+"-"+x.i]==null).length;if(un&&!S.qWarn){S.qWarn=true;render();return}
    const R=S.qset.map(x=>{const q=DAYS[x.d-1].quiz[x.i];const ch=S.ans[x.d+"-"+x.i];return {d:x.d,i:x.i,ch,ok:ch===q.a}});
    R.forEach(x=>{const k=P.mistakes.findIndex(m=>m.d===x.d&&m.i===x.i);if(x.ok&&k>=0)P.mistakes.splice(k,1);if(!x.ok&&k<0)P.mistakes.push({d:x.d,i:x.i})});
    if(!S.retry){const by={};R.forEach(x=>{const c=DAYS[x.d-1].quiz[x.i].c;by[c]=by[c]||[0,0];by[c][1]++;if(x.ok)by[c][0]++});const sc=R.filter(x=>x.ok).length;
      D(S.day).quiz={score:sc,total:R.length,byCat:by,wrong:R.filter(x=>!x.ok).map(x=>x.i),at:Date.now(),advice:advice(sc,R.length)[0]}}
    touch(S.retry?"retry":"quiz");S.res=R;S.qWarn=false;go("result")},
  retryNow:()=>{const W=S.res.filter(x=>!x.ok);S.retry=true;S.qset=W.map(x=>({d:x.d,i:x.i}));S.qi=0;S.ans={};go("quiz")},
  retryAll:()=>{S.retry=true;S.qset=P.mistakes.map(m=>({d:m.d,i:m.i}));S.qi=0;S.ans={};go("quiz")},
  sayQ:()=>speak(DAYS[S.day-1].talk.qs[S.ti||0].q,.9),
  sayBetter:()=>{if(S.fb&&S.fb.better)speak(S.fb.better,.9)},
  micTalk:()=>{stopAudio();micToggle(t=>{if(t)S.talkText=((S.talkText||"")+" "+t).trim();render()})},
  talkModel:()=>{S.showModel=!S.showModel;render()},
  talkFb:async()=>{const T=DAYS[S.day-1].talk;const q=T.qs[S.ti||0];const ans=(S.talkText||"").trim();if(!ans)return;
    if(!NS.sample){S.fb={err:"Claude feedback is not available right now. Look at the example answer and compare."};S.showModel=true;render();return}
    S.fb="loading";render();
    const prompt="You are a warm English coach for RM, a 15-year-old Malaysian kart racer. Her level is about CEFR A2 and she wants to reach B1. Context: she is talking to "+T.role+". Question: \""+q.q+"\". Her answer (from speech-to-text, so ignore small recognition errors and do not comment on punctuation): \""+ans+"\". Reply ONLY with JSON: {\"praise\":\"one short warm sentence in very simple English (A2) about what she did well\",\"better\":\"her answer improved in English, keep her own ideas, simple A2-B1 words, at most 3 short sentences\",\"fix\":\"the ONE most important grammar or word mistake, in very simple English (A2), with a wrong → right example; empty string if none\",\"word\":\"one useful English word or phrase for this topic with a very simple English meaning\"}";
    try{const r=await NS.sample.json(prompt,{modelTier:"quick"});S.fb=(r&&r.better)?r:{err:"No feedback came back. Please tap again."}}catch(e){S.fb={err:e&&e.code==="rate_limited"?"Too fast. Wait a moment, then tap again.":"No feedback came back. Look at the example answer first."}}
    const d=D(S.day);d.talkLog=(d.talkLog||[]).concat([{q:S.ti||0,a:ans}]).slice(-20);save();render()},
  talkNext:()=>{const T=DAYS[S.day-1].talk;const d=D(S.day);if((S.talkText||"").trim())d.talk=Math.max(d.talk||0,(S.ti||0)+1);else d.talk=Math.max(d.talk||0,(S.ti||0)+1);touch("talk");
    if((S.ti||0)+1<T.qs.length){S.ti=(S.ti||0)+1;S.fb=null;S.talkText="";S.showModel=false;render();window.scrollTo(0,0)}else go("finish")},
  tskip:()=>{D(S.day).talkSkip=true;touch();go("finish")},
  backup:()=>{const t="PLE1:"+btoa(unescape(encodeURIComponent(JSON.stringify(P))));S.bkText="";try{navigator.clipboard.writeText(t).then(()=>{S.bk="Backup code copied. Paste it somewhere safe.";render()}).catch(()=>{S.bk="Could not copy. Press and hold the text below to copy it.";S.bkText=t;render()})}catch(e){S.bk="Could not copy. Press and hold the text below to copy it.";S.bkText=t;render()}},
  restoreOpen:()=>{S.restoring=!S.restoring;render()},
  restoreGo:()=>{const el=document.getElementById("rs");try{const t=el.value.trim().replace(/^PLE1:/,"");const v=JSON.parse(decodeURIComponent(escape(atob(t))));if(!v||!v.days)throw 0;P=Object.assign(blank(),v);save();S.restoring=false;S.bk="Restored!";render()}catch(e){S.bk="This backup code is not right. Please paste it again.";render()}},
  copyReport:()=>{const t=reportText();try{navigator.clipboard.writeText(t).then(()=>{S.copied="Copied. Paste it in WhatsApp or a Claude chat.";S.copyFail=false;render()}).catch(()=>{S.copied="Could not copy. Press and hold the text below to copy it.";S.copyFail=true;render()})}catch(e){S.copied="Could not copy. Press and hold the text below to copy it.";S.copyFail=true;render()}}
};
app.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.tagName==="TEXTAREA")return;const f=A[b.dataset.act];if(f)f(b.dataset.arg,b)});
app.addEventListener("input",e=>{if(e.target.id==="ans"){S.talkText=e.target.value;const b=app.querySelector('[data-act="talkFb"]');if(b)b.disabled=!S.talkText.trim()}});
S.day=curDay();render();

/* ---------- CAPABILITIES ---------- */
const C=window.claude&&window.claude.use?window.claude:null;
if(C){
  C.use("tts").then(t=>{NS.tts=t;if(t){t.onLine(({id})=>{if(id)hl(+String(id).slice(1))});t.onState(({state})=>{S.playing=state==="speaking"||state==="paused";updPlay();if(state==="idle")hl(-1)})}}).catch(()=>{});
  C.use("dictation").then(d=>{NS.dict=d;NS.dictChecked=true;if(d){d.onPartial(({text})=>{if(rec&&rec.on){rec.partial=text;updMic()}});d.onFinal(({text})=>{if(rec&&rec.on){rec.final=(rec.final+" "+text).trim();rec.partial="";updMic()}});d.onState(({state})=>{if(state==="idle"&&rec&&rec.on)finishRec(rec)})}if(S.view==="home")render()}).catch(()=>{NS.dictChecked=true});
  C.use("sample").then(s=>{NS.sample=s}).catch(()=>{});
  C.use("db").then(async db=>{NS.db=db;if(!db)return;try{const r=await db.doc("progress/main").get();let v=r;if(r&&typeof r.data==="function")v=r.data();else if(r&&r.data!==undefined&&r.exists!==undefined)v=r.data;if(r&&r.exists===false)v=null;
    if(v&&v.updatedAt&&v.updatedAt>P.updatedAt){P=Object.assign(blank(),v);migrate();try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}S.day=curDay();render()}else if(P.updatedAt){save()}}catch(e){}}).catch(()=>{});
}else{NS.dictChecked=true;render()}
}
</script>
</body>
